name: Control Plane CI

on:
  push:
    branches:
      - feature/agent-control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile modal_app.py server.py

      - name: Smoke-test MCP SDK surface
        run: |
          python -m pip install --quiet "mcp>=2,<3"
          python - <<'PY'
          from mcp.server import MCPServer
          from mcp.server.transport_security import TransportSecuritySettings

          server = MCPServer("ci-smoke")

          @server.tool()
          async def ping(value: str) -> dict[str, str]:
              return {"value": value}

          app = server.streamable_http_app(
              stateless_http=True,
              json_response=True,
              transport_security=TransportSecuritySettings(
                  enable_dns_rebinding_protection=False
              ),
          )
          assert app is not None
          print("MCP SDK smoke test passed")
          PY

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/akis-app.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/akis-app.js
