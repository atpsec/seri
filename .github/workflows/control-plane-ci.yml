name: Control Plane CI

on:
  push:
    branches:
      - feature/agent-control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile modal_app.py server.py

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/akis-app.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/akis-app.js
