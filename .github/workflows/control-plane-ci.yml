name: Control Plane CI

on:
  push:
    branches:
      - feature/agent-control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile modal_app.py server.py
